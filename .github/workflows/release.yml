name: EXE Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: EXE paketle
        shell: powershell
        run: .\build_exe.ps1

      - name: Paketlenmiş Chromium'u doğrula
        shell: powershell
        run: |
          $test = Start-Process -FilePath ".\dist\OBS-Ders-Kayit.exe" -ArgumentList "--self-test" -Wait -PassThru -WindowStyle Hidden
          if ($test.ExitCode -ne 0) {
            throw "Paket self-test başarısız: $($test.ExitCode)"
          }

      - name: GitHub Release oluştur ve EXE'yi yükle
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME ".\dist\OBS-Ders-Kayit.exe" --verify-tag --latest --title "OBS Ders Kayıt $env:GITHUB_REF_NAME" --notes "Kullanıma hazır Windows sürümü. Playwright Chromium pakete dahildir; cihazdaki Chrome veya ChromeDriver sürümüne bağlı değildir. Kuru prova seçeneği yoktur; ders listeleri zorunlu son onay ekranında gösterilir."
